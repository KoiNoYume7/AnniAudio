<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnniAudio Patchbay</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #14161d;
    --surface: #1c1f29;
    --text: #e4e6eb;
    --muted: #8b92a8;
    --accent: #3b82f6;
    --accent2: #10b981;
    --danger: #ef4444;
    --border: #2a2e3a;
    --cable: #3b82f6;
    --cable-active: #10b981;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
    overflow: hidden;
  }
  header {
    height: 56px;
    padding: 0 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    flex-shrink: 0;
  }
  header h1 { margin: 0; font-size: 1.25rem; }
  .status { color: var(--muted); font-size: 0.85rem; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  #patchbay {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1rem;
    padding: 1rem;
    position: relative;
    overflow: hidden;
  }
  #cables {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }
  #cables path {
    fill: none;
    stroke: var(--cable);
    stroke-width: 3;
    stroke-linecap: round;
    pointer-events: stroke;
    transition: stroke 0.2s;
  }
  #cables path:hover { stroke: var(--accent2); cursor: pointer; }
  .column {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    z-index: 5;
  }
  .col-header {
    padding: 0.75rem 1rem;
    font-weight: 600;
    font-size: 0.95rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .col-count { font-size: 0.75rem; color: var(--muted); font-weight: 400; }
  .node-list {
    flex: 1;
    overflow-y: auto;
    padding: 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .node {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.75rem;
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    user-select: none;
  }
  .node:hover { border-color: var(--accent); }
  .node-title { flex: 1; font-size: 0.9rem; min-width: 0; }
  .node-title .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node-title .sub { font-size: 0.7rem; color: var(--muted); }
  .port {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--border);
    border: 2px solid var(--muted);
    cursor: crosshair;
    flex-shrink: 0;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
  }
  .port:hover { transform: scale(1.3); border-color: var(--accent); background: var(--accent); }
  .port.active { background: var(--accent2); border-color: var(--accent2); }
  .port.pending { background: var(--danger); border-color: var(--danger); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }
  .port-label { font-size: 0.65rem; color: var(--muted); position: absolute; top: -14px; }
  .port-wrap { position: relative; }
  .group-body { flex: 1; display: flex; flex-direction: column; gap: 0.4rem; min-width: 0; }
  .group-body .name { font-size: 0.9rem; font-weight: 500; }
  .group-body .sub { font-size: 0.7rem; color: var(--muted); }
  .group-vol { display: flex; align-items: center; gap: 0.5rem; }
  .group-vol input[type=range] { flex: 1; }
  .group-vol span { width: 2rem; font-size: 0.75rem; color: var(--muted); }
  .default-mark { color: var(--accent2); font-size: 0.75rem; margin-left: 0.25rem; }
  #bottom {
    height: 220px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #bottom h2 { margin: 0; padding: 0.6rem 1rem; font-size: 0.95rem; border-bottom: 1px solid var(--border); }
  #routes-table { flex: 1; overflow-y: auto; padding: 0 1rem; }
  .r-row {
    display: grid;
    grid-template-columns: 2fr 2fr 120px 60px 80px;
    gap: 0.75rem;
    align-items: center;
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
  }
  .r-row:last-child { border-bottom: none; }
  .r-row .cap, .r-row .ren { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r-row input[type=range] { width: 100%; }
  .muted { color: var(--muted); }
  .btn { border: none; border-radius: 0.375rem; padding: 0.35rem 0.6rem; cursor: pointer; font-size: 0.8rem; }
  .btn-danger { background: var(--danger); color: white; }
  .hint { padding: 0.5rem 1rem; font-size: 0.8rem; color: var(--muted); border-bottom: 1px solid var(--border); }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 6px; background: var(--border); border-radius: 3px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>AnniAudio Patchbay</h1>
    <span class="status" id="status">Loading...</span>
  </header>
  <div class="hint">Click an output port (right side), then click an input port (left side) to connect. Click a cable to disconnect.</div>
  <div id="patchbay">
    <svg id="cables"></svg>
    <div class="column" id="col-inputs">
      <div class="col-header">Inputs <span class="col-count" id="input-count">0</span></div>
      <div class="node-list" id="inputs"></div>
    </div>
    <div class="column" id="col-groups">
      <div class="col-header">Groups <span class="col-count" id="group-count">0</span></div>
      <div class="node-list" id="groups"></div>
    </div>
    <div class="column" id="col-outputs">
      <div class="col-header">Outputs <span class="col-count" id="output-count">0</span></div>
      <div class="node-list" id="outputs"></div>
    </div>
  </div>
  <div id="bottom">
    <h2>Active Routes & Volume</h2>
    <div id="routes-table"></div>
  </div>
</div>

<script>
let endpoints = [];
let groups = [];
let activeRoutes = [];
let connections = [];
let pending = null;
let dragging = false;

async function api(path, method='GET', body=null) {
  const opts = { method, headers: {} };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(path, opts);
  if (!res.ok) { const text = await res.text(); throw new Error(text); }
  return res.json();
}

function setStatus(msg, ok=true) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.style.color = ok ? 'var(--muted)' : 'var(--danger)';
}

async function loadData() {
  const [eps, grps, rts] = await Promise.all([api('/api/endpoints'), api('/api/groups'), api('/api/routes')]);
  endpoints = eps.endpoints || [];
  groups = grps.groups || [];
  activeRoutes = rts.routes || [];
  renderAll();
  rebuildConnections();
  drawCables();
  setStatus('Ready');
}

function renderAll() {
  renderInputs();
  renderGroups();
  renderOutputs();
  renderRoutesTable();
}

function renderInputs() {
  const list = document.getElementById('inputs');
  const inputs = endpoints.filter(e => e.flow === 'CAPTURE');
  document.getElementById('input-count').textContent = inputs.length;
  list.innerHTML = '';
  for (const e of inputs) {
    const node = document.createElement('div');
    node.className = 'node';
    node.dataset.type = 'input';
    node.dataset.id = e.name;
    node.innerHTML = `
      <div class="node-title"><div class="name">${e.name}${e.isDefault ? '<span class="default-mark">*</span>' : ''}</div><div class="sub">Capture</div></div>
      <div class="port-wrap"><div class="port" data-port="out" title="output"></div></div>
    `;
    list.appendChild(node);
  }
}

function renderGroups() {
  const list = document.getElementById('groups');
  document.getElementById('group-count').textContent = groups.length;
  list.innerHTML = '';
  for (const g of groups) {
    const cap = g.capture ? g.capture.name : 'none';
    const ren = g.render ? g.render.name : 'none';
    const node = document.createElement('div');
    node.className = 'node';
    node.dataset.type = 'group';
    node.dataset.id = g.id;
    const vol = getGroupOutVolume(g.id);
    node.innerHTML = `
      <div class="port-wrap"><div class="port" data-port="in" title="group input"></div></div>
      <div class="group-body">
        <div class="name">${g.name}</div>
        <div class="sub">in: ${cap}<br>out: ${ren}</div>
        <div class="group-vol">
          <input type="range" min="0" max="200" value="${vol}" data-kind="group" data-group="${g.id}" ${vol === null ? 'disabled' : ''}>
          <span>${vol === null ? '-' : vol + '%'}</span>
        </div>
      </div>
      <div class="port-wrap"><div class="port" data-port="out" title="group output"></div></div>
    `;
    list.appendChild(node);
  }
  list.querySelectorAll('input[data-kind=group]').forEach(slider => {
    slider.addEventListener('input', onGroupVolInput);
  });
}

function renderOutputs() {
  const list = document.getElementById('outputs');
  const outputs = endpoints.filter(e => e.flow === 'RENDER');
  document.getElementById('output-count').textContent = outputs.length;
  list.innerHTML = '';
  for (const e of outputs) {
    const node = document.createElement('div');
    node.className = 'node';
    node.dataset.type = 'output';
    node.dataset.id = e.name;
    node.innerHTML = `
      <div class="port-wrap"><div class="port" data-port="in" title="input"></div></div>
      <div class="node-title"><div class="name">${e.name}${e.isDefault ? '<span class="default-mark">*</span>' : ''}</div><div class="sub">Render</div></div>
    `;
    list.appendChild(node);
  }
}

function getGroupOutVolume(groupId) {
  const g = groups.find(x => x.id === groupId);
  if (!g || !g.capture) return null;
  const r = activeRoutes.find(r => r.capture === g.capture.name && r.running);
  return r ? r.volume : null;
}

function renderRoutesTable() {
  const table = document.getElementById('routes-table');
  if (!activeRoutes.length) { table.innerHTML = '<div class="r-row"><span class="muted">No active routes.</span></div>'; return; }
  table.innerHTML = '';
  for (const r of activeRoutes) {
    const row = document.createElement('div');
    row.className = 'r-row';
    row.innerHTML = `
      <div class="cap" title="${r.capture}">${r.capture}</div>
      <div class="ren" title="${r.render}">${r.render}</div>
      <input type="range" min="0" max="200" value="${r.volume}" onchange="setRouteVolume('${r.id}', this.value)">
      <span class="muted">${r.volume}%</span>
      <button class="btn btn-danger" onclick="stopRoute('${r.id}')">Stop</button>
    `;
    table.appendChild(row);
  }
}

async function setRouteVolume(id, volume) {
  try {
    await api('/api/route/volume', 'POST', { id, volume: parseInt(volume, 10) });
    setStatus('Volume updated');
    await loadData();
  } catch (e) { setStatus(e.message, false); }
}

async function stopRoute(id) {
  try {
    await api('/api/route/stop', 'POST', { id });
    setStatus('Route stopped');
    await loadData();
  } catch (e) { setStatus(e.message, false); }
}

function onGroupVolInput(e) {
  const slider = e.target;
  const groupId = parseInt(slider.dataset.group, 10);
  const g = groups.find(x => x.id === groupId);
  if (!g || !g.capture) return;
  const r = activeRoutes.find(x => x.capture === g.capture.name && x.running);
  if (!r) return;
  slider.nextElementSibling.textContent = slider.value + '%';
  setRouteVolume(r.id, slider.value);
}

function rebuildConnections() {
  connections = [];
  for (const r of activeRoutes) {
    if (!r.running) continue;
    const targetGroup = groups.find(g => g.render && g.render.name === r.render);
    if (targetGroup) {
      connections.push({ routeId: r.id, from: { type: 'input', id: r.capture, port: 'out' }, to: { type: 'group', id: targetGroup.id, port: 'in' } });
    }
    const sourceGroup = groups.find(g => g.capture && g.capture.name === r.capture);
    if (sourceGroup) {
      connections.push({ routeId: r.id, from: { type: 'group', id: sourceGroup.id, port: 'out' }, to: { type: 'output', id: r.render, port: 'in' } });
    }
  }
}

function getPortEl(type, id, port) {
  const colMap = { input: 'inputs', group: 'groups', output: 'outputs' };
  const list = document.getElementById(colMap[type]);
  const node = list.querySelector(`.node[data-type="${type}"][data-id="${CSS.escape(id)}"]`) || list.querySelector(`.node[data-type="${type}"][data-id="${id}"]`);
  if (!node) return null;
  return node.querySelector(`.port[data-port="${port}"]`);
}

function drawCables() {
  const svg = document.getElementById('cables');
  const patch = document.getElementById('patchbay');
  const prect = patch.getBoundingClientRect();
  svg.innerHTML = '';
  for (const c of connections) {
    const fromEl = getPortEl(c.from.type, c.from.id, c.from.port);
    const toEl = getPortEl(c.to.type, c.to.id, c.to.port);
    if (!fromEl || !toEl) continue;
    const f = fromEl.getBoundingClientRect();
    const t = toEl.getBoundingClientRect();
    const x1 = f.left - prect.left + f.width / 2;
    const y1 = f.top - prect.top + f.height / 2;
    const x2 = t.left - prect.left + t.width / 2;
    const y2 = t.top - prect.top + t.height / 2;
    const cp1x = x1 + 80;
    const cp1y = y1;
    const cp2x = x2 - 80;
    const cp2y = y2;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M ${x1} ${y1} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${x2} ${y2}`);
    path.dataset.routeId = c.routeId;
    path.addEventListener('click', () => stopRoute(c.routeId));
    svg.appendChild(path);
  }
  if (pending && pending.el) {
    const f = pending.el.getBoundingClientRect();
    const x1 = f.left - prect.left + f.width / 2;
    const y1 = f.top - prect.top + f.height / 2;
    const x2 = pending.mx || x1;
    const y2 = pending.my || y1;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M ${x1} ${y1} L ${x2} ${y2}`);
    path.setAttribute('stroke', 'var(--danger)');
    path.setAttribute('stroke-dasharray', '5,5');
    svg.appendChild(path);
  }
}

function portClick(e) {
  e.stopPropagation();
  const port = e.currentTarget;
  const node = port.closest('.node');
  const type = node.dataset.type;
  const id = node.dataset.id;
  const portName = port.dataset.port;

  if (!pending) {
    if (portName !== 'out') { setStatus('Start from an output port', false); return; }
    pending = { type, id, port: portName, el: port };
    port.classList.add('pending');
    setStatus('Click a target input port to connect');
    return;
  }

  if (portName !== 'in') { setStatus('Target must be an input port', false); return; }

  const source = { type: pending.type, id: pending.id, port: pending.port };
  const target = { type, id, port: portName };

  clearPending();
  createConnection(source, target);
}

function clearPending() {
  if (pending) {
    pending.el.classList.remove('pending');
    pending = null;
  }
}

async function createConnection(source, target) {
  let capture, render;
  if (source.type === 'input' && target.type === 'group') {
    const g = groups.find(x => x.id === target.id);
    if (!g || !g.render) { setStatus('Group has no render endpoint', false); return; }
    capture = source.id;
    render = g.render.name;
  } else if (source.type === 'group' && target.type === 'output') {
    const g = groups.find(x => x.id === source.id);
    if (!g || !g.capture) { setStatus('Group has no capture endpoint', false); return; }
    capture = g.capture.name;
    render = target.id;
  } else {
    setStatus('Connect input→group or group→output only', false); return;
  }

  try {
    setStatus('Starting route...');
    await api('/api/route/start', 'POST', { capture, render, volume: 100 });
    setStatus('Route started');
    await loadData();
  } catch (err) { setStatus(err.message, false); }
}

function onMouseMove(e) {
  if (!pending) return;
  pending.mx = e.clientX;
  pending.my = e.clientY;
  drawCables();
}

function onClickBackground(e) {
  if (e.target.id === 'patchbay' || e.target.id === 'cables') {
    clearPending();
    drawCables();
  }
}

function attachPortListeners() {
  document.querySelectorAll('.port').forEach(p => p.addEventListener('click', portClick));
}

async function init() {
  try {
    await loadData();
    attachPortListeners();
    window.addEventListener('resize', () => { drawCables(); });
    document.querySelectorAll('.node-list').forEach(el => el.addEventListener('scroll', drawCables));
    document.getElementById('patchbay').addEventListener('mousemove', onMouseMove);
    document.getElementById('patchbay').addEventListener('click', onClickBackground);
    setInterval(loadData, 2000);
  } catch (e) {
    setStatus(e.message, false);
  }
}

init();
</script>
</body>
</html>
