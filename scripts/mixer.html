<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnniAudio Mixer</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #14161d;
    --surface: #1c1f29;
    --text: #e4e6eb;
    --muted: #8b92a8;
    --accent: #3b82f6;
    --accent2: #10b981;
    --danger: #ef4444;
    --border: #2a2e3a;
    --cable: #6366f1;
    --cable-active: #22d3ee;
    --input-bg: #0f1118;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    height: 56px;
    padding: 0 1rem;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    gap: 1rem;
  }
  header h1 { margin: 0; font-size: 1.2rem; letter-spacing: -0.01em; }
  .toolbar { display: flex; align-items: center; gap: 0.75rem; }
  .status { font-size: 0.85rem; color: var(--muted); }
  .status.connected { color: var(--accent2); }
  .status.error { color: var(--danger); }
  input, select, button {
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 0.375rem;
    padding: 0.4rem 0.6rem;
    font-size: 0.85rem;
  }
  button { background: var(--surface); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button.primary:hover { filter: brightness(1.1); }
  button.danger { background: var(--danger); border-color: var(--danger); color: white; }
  button.danger:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #patchbay {
    flex: 1;
    display: grid;
    grid-template-columns: 280px 1fr 280px;
    gap: 1rem;
    padding: 1rem;
    position: relative;
    overflow: hidden;
  }
  #cables {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
  }
  #cables path {
    fill: none;
    stroke: var(--cable);
    stroke-width: 3;
    stroke-linecap: round;
    opacity: 0.7;
    transition: stroke 0.1s, opacity 0.1s, stroke-width 0.1s;
    filter: drop-shadow(0 0 2px rgba(99,102,241,0.5));
  }
  #cables path.active {
    stroke: var(--cable-active);
    opacity: 1;
    stroke-width: 4;
    filter: drop-shadow(0 0 5px rgba(34,211,238,0.7));
  }

  .column {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 10;
    position: relative;
  }
  .col-header {
    padding: 0.75rem 1rem;
    font-weight: 600;
    font-size: 0.95rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .node-list {
    flex: 1;
    overflow-y: auto;
    padding: 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .node {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.75rem;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
    min-height: 110px;
  }
  .node.output { border-color: var(--accent); }
  .node.route { border-color: #4f46e5; }
  .node-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
  }
  .node-title {
    font-weight: 600;
    font-size: 0.9rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 0;
    flex: 1;
  }
  .node-title:focus {
    outline: 1px solid var(--accent);
    background: var(--input-bg);
  }
  .node-sub {
    font-size: 0.7rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .node-body {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .meter {
    width: 12px;
    height: 80px;
    background: var(--input-bg);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  .meter-fill {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background: linear-gradient(to top, var(--accent2) 0%, #facc15 60%, var(--danger) 100%);
    border-radius: 0 0 6px 6px;
    transition: height 0.05s linear;
  }
  .meter-peak {
    position: absolute;
    left: 0;
    width: 100%;
    height: 3px;
    background: #fff;
    border-radius: 2px;
    transition: bottom 0.05s linear;
  }

  .controls {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    min-width: 0;
  }
  .fader-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
  }
  .fader-row input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    outline: none;
  }
  .fader-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  .fader-row span { width: 2.5rem; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  .btn-mute {
    font-size: 0.75rem;
    padding: 0.25rem 0.5rem;
  }
  .btn-mute.muted { background: var(--danger); border-color: var(--danger); color: white; }
  .btn-row { display: flex; gap: 0.4rem; }

  .port {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--border);
    border: 2px solid var(--muted);
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
  }
  .port.out { right: -8px; }
  .port.in { left: -8px; }
  .port:hover { transform: translateY(-50%) scale(1.3); border-color: var(--cable-active); background: var(--cable-active); }

  .add-btn {
    margin: 0.75rem;
    padding: 0.6rem;
    text-align: center;
    border: 2px dashed var(--border);
    border-radius: 0.5rem;
    color: var(--muted);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .add-btn:hover { border-color: var(--accent); color: var(--text); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 1.25rem;
    width: 90%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .modal h2 { margin: 0 0 0.25rem 0; font-size: 1.1rem; }
  .modal-row { display: flex; flex-direction: column; gap: 0.35rem; }
  .modal-row label { font-size: 0.8rem; color: var(--muted); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.5rem; }

  .empty {
    color: var(--muted);
    font-style: italic;
    padding: 1rem;
    text-align: center;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<header>
  <h1>AnniAudio Mixer</h1>
  <div class="toolbar">
    <span class="status" id="status">Disconnected</span>
    <input id="port" type="number" value="8850" min="0" max="65535" style="width:80px" title="Control API port">
    <button id="btn-save">Save preset</button>
  </div>
</header>

<div id="patchbay">
  <svg id="cables"><g id="cable-layer"></g></svg>

  <div class="column" id="col-routes">
    <div class="col-header">Routes <span id="route-count" class="status">0</span></div>
    <div class="node-list" id="routes"></div>
    <div class="add-btn" id="btn-add-route">+ Add route</div>
  </div>

  <div class="column" id="col-workspace" style="background:transparent; border:none; z-index:1;"></div>

  <div class="column" id="col-outputs">
    <div class="col-header">Outputs <span id="output-count" class="status">0</span></div>
    <div class="node-list" id="outputs"></div>
    <div class="add-btn" id="btn-add-output">+ Add output</div>
  </div>
</div>

<div class="modal-overlay" id="route-modal">
  <div class="modal">
    <h2>Add route</h2>
    <div class="modal-row"><label>Source endpoint</label><select id="route-source"></select></div>
    <div class="modal-row"><label>Output</label><select id="route-output"></select></div>
    <div class="modal-row"><label>Name (optional)</label><input id="route-name" type="text" placeholder="defaults to source name"></div>
    <div class="modal-row"><label>Initial volume (%)</label><input id="route-volume" type="number" value="100" min="0" max="200"></div>
    <div class="modal-actions">
      <button id="route-cancel">Cancel</button>
      <button id="route-ok" class="primary">Add</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="output-modal">
  <div class="modal">
    <h2>Add output</h2>
    <div class="modal-row"><label>Render endpoint</label><select id="output-source"></select></div>
    <div class="modal-actions">
      <button id="output-cancel">Cancel</button>
      <button id="output-ok" class="primary">Add</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="save-modal">
  <div class="modal">
    <h2>Save preset</h2>
    <div class="modal-row"><label>Path (e.g. config/mixers/my_mix.json)</label><input id="save-path" type="text" value="config/mixers/"></div>
    <div class="modal-actions">
      <button id="save-cancel">Cancel</button>
      <button id="save-ok" class="primary">Save</button>
    </div>
  </div>
</div>

<script>
const qs = new URLSearchParams(location.search);
let port = parseInt(qs.get('port'), 10) || 8850;
const portInput = document.getElementById('port');
portInput.value = port;

let base = `http://127.0.0.1:${port}`;
let state = null;
let endpoints = [];
let es = null;

function setStatus(text, cls) {
  const s = document.getElementById('status');
  s.textContent = text;
  s.className = 'status' + (cls ? ' ' + cls : '');
}

function rebuildBase() {
  port = parseInt(portInput.value, 10) || 8850;
  base = `http://127.0.0.1:${port}`;
  connect();
}
portInput.addEventListener('change', rebuildBase);

async function api(path, opts = {}) {
  const res = await fetch(base + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  if (!res.ok) {
    let msg = res.statusText;
    try { const j = await res.json(); if (j.error) msg = j.error; } catch {}
    throw new Error(msg);
  }
  if (res.status === 204) return null;
  return res.json();
}

function connect() {
  if (es) { es.close(); es = null; }
  setStatus('Connecting...');
  es = new EventSource(base + '/api/events');
  es.onopen = () => { setStatus('Connected', 'connected'); refreshEndpoints(); };
  es.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data.replace(/^data: /, ''));
      if (msg && typeof msg === 'object') updateState(msg);
    } catch (err) { console.error('SSE parse error', err); }
  };
  es.onerror = () => setStatus('Disconnected', 'error');
}

function updateState(newState) {
  state = newState;
  render();
}

function dbFromLinear(v) {
  if (v <= 0.00001) return -60;
  return 20 * Math.log10(Math.min(v, 1));
}

function meterPercent(v) {
  const db = dbFromLinear(v);
  return Math.max(0, Math.min(100, (db + 60) / 60 * 100));
}

function updateMeter(meter, peak, rms) {
  if (!meter) return;
  const fill = meter.querySelector('.meter-fill');
  const pk = meter.querySelector('.meter-peak');
  fill.style.height = meterPercent(rms) + '%';
  pk.style.bottom = meterPercent(peak) + '%';
}

function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function outputCard(out) {
  const el = document.createElement('div');
  el.className = 'node output';
  el.id = 'output-' + out.name.replace(/[^a-zA-Z0-9]/g, '_');
  el.dataset.name = out.name;
  el.innerHTML = `
    <div class="port in"></div>
    <div class="node-header">
      <input class="node-title output-name" value="${escapeHtml(out.name)}" readonly title="${escapeHtml(out.name)}">
      <button class="danger output-remove" title="Remove">×</button>
    </div>
    <div class="node-body">
      <div class="meter" id="meter-out-${out.name.replace(/[^a-zA-Z0-9]/g, '_')}"><div class="meter-fill"></div><div class="meter-peak"></div></div>
      <div class="controls">
        <div class="fader-row">
          <input type="range" min="0" max="200" value="${Math.round(out.master)}" class="output-fader">
          <span>${Math.round(out.master)}%</span>
        </div>
      </div>
    </div>
  `;

  const fader = el.querySelector('.output-fader');
  fader.addEventListener('input', () => { el.querySelector('.fader-row span').textContent = fader.value + '%'; });
  fader.addEventListener('change', async () => {
    try { await api('/api/outputs/master', { method: 'POST', body: JSON.stringify({ name: out.name, volume: parseFloat(fader.value) }) }); }
    catch (e) { setStatus(e.message, 'error'); }
  });

  el.querySelector('.output-remove').addEventListener('click', async () => {
    try { await api('/api/outputs', { method: 'DELETE', body: JSON.stringify({ name: out.name }) }); }
    catch (e) { setStatus(e.message, 'error'); }
  });

  return el;
}

function routeCard(s) {
  const el = document.createElement('div');
  el.className = 'node route';
  el.id = 'route-' + s.id;
  el.dataset.id = s.id;
  el.dataset.output = s.output;
  el.innerHTML = `
    <div class="port out"></div>
    <div class="node-header">
      <input class="node-title route-name" value="${escapeHtml(s.name)}" title="${escapeHtml(s.name)}">
      <button class="danger route-remove" title="Remove">×</button>
    </div>
    <div class="node-sub" title="${escapeHtml(s.source)}">${escapeHtml(s.source)} → ${escapeHtml(s.output)}</div>
    <div class="node-body">
      <div class="meter" id="meter-route-${s.id}"><div class="meter-fill"></div><div class="meter-peak"></div></div>
      <div class="controls">
        <div class="fader-row">
          <input type="range" min="0" max="200" value="${Math.round(s.volume)}" class="route-fader">
          <span>${Math.round(s.volume)}%</span>
        </div>
        <button class="btn-mute ${s.muted ? 'muted' : ''}">${s.muted ? 'Unmute' : 'Mute'}</button>
      </div>
    </div>
  `;

  const nameInput = el.querySelector('.route-name');
  nameInput.addEventListener('change', async () => {
    try { await api(`/api/strips/${s.id}`, { method: 'PATCH', body: JSON.stringify({ name: nameInput.value }) }); }
    catch (e) { setStatus(e.message, 'error'); }
  });

  const fader = el.querySelector('.route-fader');
  fader.addEventListener('input', () => { el.querySelector('.fader-row span').textContent = fader.value + '%'; });
  fader.addEventListener('change', async () => {
    try { await api(`/api/strips/${s.id}`, { method: 'PATCH', body: JSON.stringify({ volume: parseFloat(fader.value) }) }); }
    catch (e) { setStatus(e.message, 'error'); }
  });

  const muteBtn = el.querySelector('.btn-mute');
  muteBtn.addEventListener('click', async () => {
    try { await api(`/api/strips/${s.id}`, { method: 'PATCH', body: JSON.stringify({ muted: !s.muted }) }); }
    catch (e) { setStatus(e.message, 'error'); }
  });

  el.querySelector('.route-remove').addEventListener('click', async () => {
    try { await api(`/api/strips/${s.id}`, { method: 'DELETE' }); }
    catch (e) { setStatus(e.message, 'error'); }
  });

  return el;
}

function render() {
  if (!state) return;
  const outputs = state.outputs || [];
  const routes = outputs.reduce((acc, o) => acc.concat(o.strips || []), []);
  document.getElementById('output-count').textContent = outputs.length;
  document.getElementById('route-count').textContent = routes.length;

  const outList = document.getElementById('outputs');
  outList.innerHTML = '';
  if (outputs.length === 0) {
    outList.innerHTML = '<div class="empty">No outputs. Add one to get started.</div>';
  } else {
    for (const out of outputs) {
      outList.appendChild(outputCard(out));
      updateMeter(document.getElementById('meter-out-' + out.name.replace(/[^a-zA-Z0-9]/g, '_')), out.masterPeak || 0, out.masterRms || 0);
    }
  }

  const routeList = document.getElementById('routes');
  routeList.innerHTML = '';
  if (routes.length === 0) {
    routeList.innerHTML = '<div class="empty">No routes. Click + Add route to connect a source to an output.</div>';
  } else {
    for (const s of routes) {
      routeList.appendChild(routeCard(s));
      updateMeter(document.getElementById('meter-route-' + s.id), s.peak || 0, s.rms || 0);
    }
  }

  drawCables();
  populateEndpointSelects();
}

function getOutputEl(name) {
  return document.querySelector(`.output[data-name="${CSS.escape(name)}"]`);
}

function drawCables() {
  const svg = document.getElementById('cable-layer');
  svg.innerHTML = '';
  if (!state || !state.outputs) return;

  const pbRect = document.getElementById('patchbay').getBoundingClientRect();

  const routes = state.outputs.reduce((acc, o) => acc.concat(o.strips || []), []);
  for (const s of routes) {
    const src = document.getElementById('route-' + s.id);
    const dst = getOutputEl(s.output);
    if (!src || !dst) continue;
    const sRect = src.getBoundingClientRect();
    const dRect = dst.getBoundingClientRect();
    const sx = sRect.right - pbRect.left;
    const sy = sRect.top + sRect.height / 2 - pbRect.top;
    const dx = dRect.left - pbRect.left;
    const dy = dRect.top + dRect.height / 2 - pbRect.top;
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const ox = (dx - sx) * 0.5;
    c.setAttribute('d', `M ${sx} ${sy} C ${sx + ox} ${sy}, ${dx - ox} ${dy}, ${dx} ${dy}`);
    if (s.peak > 0.01) c.classList.baseVal.add('active');
    svg.appendChild(c);
  }
}

function populateEndpointSelects() {
  const routeSource = document.getElementById('route-source');
  const outputSource = document.getElementById('output-source');
  const routeOutput = document.getElementById('route-output');

  // Only rebuild if empty to avoid clearing user selection.
  if (routeSource.children.length === 0 && endpoints.length) {
    for (const ep of endpoints) {
      const opt = document.createElement('option');
      opt.value = ep.name;
      opt.textContent = `${ep.isRender ? '[Render]' : '[Capture]'} ${ep.name}`;
      routeSource.appendChild(opt);
    }
  }
  if (outputSource.children.length === 0 && endpoints.length) {
    for (const ep of endpoints) {
      if (!ep.isRender) continue;
      const opt = document.createElement('option');
      opt.value = ep.name;
      opt.textContent = ep.name;
      outputSource.appendChild(opt);
    }
  }

  routeOutput.innerHTML = '';
  if (state && state.outputs) {
    for (const out of state.outputs) {
      const opt = document.createElement('option');
      opt.value = out.name;
      opt.textContent = out.name;
      routeOutput.appendChild(opt);
    }
  }
}

async function refreshEndpoints() {
  try {
    const data = await api('/api/endpoints');
    endpoints = data.endpoints;
    document.getElementById('route-source').innerHTML = '';
    document.getElementById('output-source').innerHTML = '';
    populateEndpointSelects();
  } catch (e) { console.error('Endpoints load failed', e); }
}

window.addEventListener('resize', drawCables);
document.getElementById('routes').addEventListener('scroll', drawCables, { passive: true });
document.getElementById('outputs').addEventListener('scroll', drawCables, { passive: true });

document.getElementById('btn-add-route').addEventListener('click', async () => {
  await refreshEndpoints();
  document.getElementById('route-modal').classList.add('open');
});
document.getElementById('route-cancel').addEventListener('click', () => document.getElementById('route-modal').classList.remove('open'));
document.getElementById('route-ok').addEventListener('click', async () => {
  const source = document.getElementById('route-source').value;
  const output = document.getElementById('route-output').value;
  const name = document.getElementById('route-name').value;
  const volume = parseFloat(document.getElementById('route-volume').value) || 100;
  try {
    await api('/api/strips', { method: 'POST', body: JSON.stringify({ source, output, name, volume }) });
    document.getElementById('route-modal').classList.remove('open');
    document.getElementById('route-name').value = '';
  } catch (e) { alert('Failed to add route: ' + e.message); }
});

document.getElementById('btn-add-output').addEventListener('click', async () => {
  await refreshEndpoints();
  document.getElementById('output-modal').classList.add('open');
});
document.getElementById('output-cancel').addEventListener('click', () => document.getElementById('output-modal').classList.remove('open'));
document.getElementById('output-ok').addEventListener('click', async () => {
  const name = document.getElementById('output-source').value;
  try {
    await api('/api/outputs', { method: 'POST', body: JSON.stringify({ name }) });
    document.getElementById('output-modal').classList.remove('open');
  } catch (e) { alert('Failed to add output: ' + e.message); }
});

document.getElementById('btn-save').addEventListener('click', () => document.getElementById('save-modal').classList.add('open'));
document.getElementById('save-cancel').addEventListener('click', () => document.getElementById('save-modal').classList.remove('open'));
document.getElementById('save-ok').addEventListener('click', async () => {
  const path = document.getElementById('save-path').value.trim();
  if (!path) return;
  try {
    await api('/api/presets/save', { method: 'POST', body: JSON.stringify({ path }) });
    document.getElementById('save-modal').classList.remove('open');
    setStatus('Preset saved', 'connected');
  } catch (e) { alert('Failed to save: ' + e.message); }
});

connect();
</script>
</body>
