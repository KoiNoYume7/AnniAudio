<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnniAudio Mixer</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #14161d;
    --surface: #1c1f29;
    --text: #e4e6eb;
    --muted: #8b92a8;
    --accent: #3b82f6;
    --accent2: #10b981;
    --danger: #ef4444;
    --border: #2a2e3a;
    --cable: #6366f1;
    --cable-active: #22d3ee;
    --input-bg: #0f1118;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    height: 56px;
    padding: 0 1rem;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    gap: 1rem;
  }
  header h1 { margin: 0; font-size: 1.2rem; letter-spacing: -0.01em; }
  .toolbar { display: flex; align-items: center; gap: 0.75rem; }
  .status { font-size: 0.85rem; color: var(--muted); }
  .status.connected { color: var(--accent2); }
  .status.error { color: var(--danger); }
  input, select, button {
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 0.375rem;
    padding: 0.4rem 0.6rem;
    font-size: 0.85rem;
  }
  button { background: var(--surface); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button.primary:hover { filter: brightness(1.1); }
  button.danger { background: var(--danger); border-color: var(--danger); color: white; }
  button.danger:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #patchbay {
    flex: 1;
    display: grid;
    grid-template-columns: 260px 1fr 260px;
    gap: 1rem;
    padding: 1rem;
    position: relative;
    overflow: hidden;
  }
  #cables {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
  }
  #cables path {
    fill: none;
    stroke: var(--cable);
    stroke-width: 3;
    stroke-linecap: round;
    opacity: 0.75;
    transition: stroke 0.1s, opacity 0.1s, stroke-width 0.1s;
    filter: drop-shadow(0 0 2px rgba(99,102,241,0.5));
  }
  #cables path.active {
    stroke: var(--cable-active);
    opacity: 1;
    stroke-width: 4;
    filter: drop-shadow(0 0 5px rgba(34,211,238,0.7));
  }

  .column {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 10;
    position: relative;
  }
  .col-header {
    padding: 0.75rem 1rem;
    font-weight: 600;
    font-size: 0.95rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .node-list {
    flex: 1;
    overflow-y: auto;
    padding: 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .node {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.75rem;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    min-height: 130px;
  }
  .node.output { border-color: var(--accent); }
  .node-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
  }
  .node-title {
    font-weight: 600;
    font-size: 0.9rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .node-sub {
    font-size: 0.7rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .node-body {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .meter {
    width: 12px;
    height: 90px;
    background: var(--input-bg);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  .meter-fill {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background: linear-gradient(to top, var(--accent2) 0%, #facc15 60%, var(--danger) 100%);
    border-radius: 0 0 6px 6px;
    transition: height 0.05s linear;
  }
  .meter-peak {
    position: absolute;
    left: 0;
    width: 100%;
    height: 3px;
    background: #fff;
    border-radius: 2px;
    transition: bottom 0.05s linear;
  }

  .controls {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    min-width: 0;
  }
  .fader-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
  }
  .fader-row input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    outline: none;
  }
  .fader-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  .fader-row span { width: 2.5rem; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  .btn-mute {
    font-size: 0.75rem;
    padding: 0.3rem 0.5rem;
  }
  .btn-mute.muted { background: var(--danger); border-color: var(--danger); color: white; }

  .port {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--border);
    border: 2px solid var(--muted);
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
    cursor: crosshair;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
  }
  .port:hover { transform: translateY(-50%) scale(1.3); border-color: var(--cable-active); background: var(--cable-active); }
  .port.in { left: -8px; }
  .port.out { right: -8px; }
  .port.connected { background: var(--cable-active); border-color: var(--cable-active); box-shadow: 0 0 8px var(--cable-active); }

  .add-source {
    margin: 0.75rem;
    padding: 0.6rem;
    text-align: center;
    border: 2px dashed var(--border);
    border-radius: 0.5rem;
    color: var(--muted);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .add-source:hover { border-color: var(--accent); color: var(--text); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 1.25rem;
    width: 90%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .modal h2 { margin: 0 0 0.25rem 0; font-size: 1.1rem; }
  .modal-row { display: flex; flex-direction: column; gap: 0.35rem; }
  .modal-row label { font-size: 0.8rem; color: var(--muted); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.5rem; }

  .empty {
    color: var(--muted);
    font-style: italic;
    padding: 1rem;
    text-align: center;
    font-size: 0.85rem;
  }
  .hint { padding: 0.5rem 1rem; font-size: 0.8rem; color: var(--muted); text-align: center; border-bottom: 1px solid var(--border); }
</style>
</head>
<body>
<header>
  <h1>AnniAudio Mixer</h1>
  <div class="toolbar">
    <span class="status" id="status">Disconnected</span>
    <input id="port" type="number" value="8850" min="0" max="65535" style="width:80px" title="Control API port">
    <button id="btn-save">Save preset</button>
  </div>
</header>

<div id="patchbay">
  <svg id="cables"><g id="cable-layer"></g></svg>

  <div class="column" id="col-sources">
    <div class="col-header">Sources <span class="status" id="source-count">0</span></div>
    <div class="node-list" id="sources"></div>
    <div class="add-source" id="btn-add">+ Add source</div>
  </div>

  <div class="column" id="col-workspace" style="background:transparent; border:none; z-index:1;"></div>

  <div class="column" id="col-outputs">
    <div class="col-header">Outputs</div>
    <div class="node-list" id="outputs">
      <div class="node output" id="master-node" data-type="master">
        <div class="port in" style="left:-8px;"></div>
        <div class="node-header">
          <span class="node-title" id="master-title">Master</span>
        </div>
        <div class="node-sub" id="master-output-name">—</div>
        <div class="node-body">
          <div class="meter" id="master-meter"><div class="meter-fill"></div><div class="meter-peak"></div></div>
          <div class="controls">
            <div class="fader-row">
              <input id="master-volume" type="range" min="0" max="200" value="100">
              <span id="master-value">100%</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <h2>Add source</h2>
    <div class="modal-row">
      <label>Source endpoint</label>
      <select id="add-source"></select>
    </div>
    <div class="modal-row">
      <label>Name (optional)</label>
      <input id="add-name" type="text" placeholder="defaults to source name">
    </div>
    <div class="modal-row">
      <label>Initial volume (%)</label>
      <input id="add-volume" type="number" value="100" min="0" max="200">
    </div>
    <div class="modal-actions">
      <button id="add-cancel">Cancel</button>
      <button id="add-ok" class="primary">Add</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="save-modal">
  <div class="modal">
    <h2>Save preset</h2>
    <div class="modal-row">
      <label>Filename (relative to project root, e.g. config/mixers/my_mix.json)</label>
      <input id="save-path" type="text" value="config/mixers/">
    </div>
    <div class="modal-actions">
      <button id="save-cancel">Cancel</button>
      <button id="save-ok" class="primary">Save</button>
    </div>
  </div>
</div>

<script>
const qs = new URLSearchParams(location.search);
let port = parseInt(qs.get('port'), 10) || 8850;
const portInput = document.getElementById('port');
portInput.value = port;

let base = `http://127.0.0.1:${port}`;
let state = null;
let es = null;

function setStatus(text, cls) {
  const s = document.getElementById('status');
  s.textContent = text;
  s.className = 'status' + (cls ? ' ' + cls : '');
}

function rebuildBase() {
  port = parseInt(portInput.value, 10) || 8850;
  base = `http://127.0.0.1:${port}`;
  connect();
}
portInput.addEventListener('change', rebuildBase);

async function api(path, opts = {}) {
  const res = await fetch(base + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  if (!res.ok) {
    let msg = res.statusText;
    try { const j = await res.json(); if (j.error) msg = j.error; } catch {}
    throw new Error(msg);
  }
  if (res.status === 204) return null;
  return res.json();
}

function connect() {
  if (es) { es.close(); es = null; }
  setStatus('Connecting...');
  es = new EventSource(base + '/api/events');
  es.onopen = () => setStatus('Connected', 'connected');
  es.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data.replace(/^data: /, ''));
      if (msg && typeof msg === 'object') updateState(msg);
    } catch (err) { console.error('SSE parse error', err); }
  };
  es.onerror = () => setStatus('Disconnected', 'error');
}

function updateState(newState) {
  state = newState;
  render();
}

function dbFromLinear(v) {
  if (v <= 0.00001) return -60;
  return 20 * Math.log10(Math.min(v, 1));
}

function meterPercent(v) {
  // Map -60..0 dB to 0..100%
  const db = dbFromLinear(v);
  return Math.max(0, Math.min(100, (db + 60) / 60 * 100));
}

function render() {
  if (!state) return;

  document.getElementById('source-count').textContent = state.strips ? state.strips.length : 0;
  document.getElementById('master-output-name').textContent = state.output || '—';
  document.getElementById('master-title').textContent = 'Master';

  const mv = document.getElementById('master-volume');
  if (document.activeElement !== mv) mv.value = Math.round(state.master);
  document.getElementById('master-value').textContent = Math.round(state.master) + '%';
  updateMeter(document.getElementById('master-meter'), state.masterPeak || 0, state.masterRms || 0);

  const sources = document.getElementById('sources');
  if (!state.strips || state.strips.length === 0) {
    sources.innerHTML = '<div class="empty">No sources connected. Click + Add source to start.</div>';
  } else {
    sources.innerHTML = '';
    for (const s of state.strips) {
      const el = document.createElement('div');
      el.className = 'node' + (s.muted ? ' muted' : '');
      el.dataset.id = s.id;
      el.id = 'strip-' + s.id;
      el.innerHTML = `
        <div class="port out"></div>
        <div class="node-header">
          <input class="node-title strip-name" value="${escapeHtml(s.name)}" title="${escapeHtml(s.name)}">
          <button class="danger strip-remove" title="Remove">×</button>
        </div>
        <div class="node-sub" title="${escapeHtml(s.source)}">${escapeHtml(s.source)}</div>
        <div class="node-body">
          <div class="meter" id="meter-${s.id}"><div class="meter-fill"></div><div class="meter-peak"></div></div>
          <div class="controls">
            <div class="fader-row">
              <input type="range" min="0" max="200" value="${Math.round(s.volume)}" class="strip-fader">
              <span>${Math.round(s.volume)}%</span>
            </div>
            <button class="btn-mute ${s.muted ? 'muted' : ''}">${s.muted ? 'Unmute' : 'Mute'}</button>
          </div>
        </div>
      `;
      const nameInput = el.querySelector('.strip-name');
      nameInput.addEventListener('change', () => patchStrip(s.id, { name: nameInput.value }));

      const fader = el.querySelector('.strip-fader');
      fader.addEventListener('input', () => { el.querySelector('.fader-row span').textContent = fader.value + '%'; });
      fader.addEventListener('change', () => patchStrip(s.id, { volume: parseFloat(fader.value) }));

      const muteBtn = el.querySelector('.btn-mute');
      muteBtn.addEventListener('click', () => patchStrip(s.id, { muted: !s.muted }));

      const removeBtn = el.querySelector('.strip-remove');
      removeBtn.addEventListener('click', () => removeStrip(s.id));

      sources.appendChild(el);

      updateMeter(document.getElementById('meter-' + s.id), s.peak || 0, s.rms || 0);
    }
  }

  drawCables();
}

function updateMeter(meter, peak, rms) {
  if (!meter) return;
  const fill = meter.querySelector('.meter-fill');
  const pk = meter.querySelector('.meter-peak');
  fill.style.height = meterPercent(rms) + '%';
  pk.style.bottom = meterPercent(peak) + '%';
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function patchStrip(id, changes) {
  try {
    await api(`/api/strips/${id}`, { method: 'PATCH', body: JSON.stringify(changes) });
  } catch (e) {
    setStatus(e.message, 'error');
    setTimeout(() => setStatus('Connected', 'connected'), 2000);
  }
}

async function removeStrip(id) {
  try { await api(`/api/strips/${id}`, { method: 'DELETE' }); }
  catch (e) { setStatus(e.message, 'error'); }
}

async function addStrip() {
  const source = document.getElementById('add-source').value;
  if (!source) return;
  const name = document.getElementById('add-name').value;
  const volume = parseFloat(document.getElementById('add-volume').value) || 100;
  try {
    await api('/api/strips', { method: 'POST', body: JSON.stringify({ source, name, volume }) });
    document.getElementById('add-modal').classList.remove('open');
    document.getElementById('add-name').value = '';
    document.getElementById('add-volume').value = '100';
  } catch (e) { alert('Failed to add source: ' + e.message); }
}

async function refreshEndpoints() {
  try {
    const { endpoints } = await api('/api/endpoints');
    const sel = document.getElementById('add-source');
    sel.innerHTML = '';
    for (const ep of endpoints) {
      const opt = document.createElement('option');
      opt.value = ep.name;
      opt.textContent = `${ep.isRender ? '[Render]' : '[Capture]'} ${ep.name}${ep.isDefault ? ' (default)' : ''}`;
      sel.appendChild(opt);
    }
  } catch (e) { console.error('Endpoints load failed', e); }
}

function drawCables() {
  const svg = document.getElementById('cable-layer');
  svg.innerHTML = '';
  if (!state || !state.strips) return;

  const master = document.getElementById('master-node');
  if (!master) return;
  const mRect = master.getBoundingClientRect();
  const pbRect = document.getElementById('patchbay').getBoundingClientRect();
  const mx = mRect.left - pbRect.left;
  const my = mRect.top + mRect.height / 2 - pbRect.top;

  for (const s of state.strips) {
    const src = document.getElementById('strip-' + s.id);
    if (!src) continue;
    const sRect = src.getBoundingClientRect();
    const sx = sRect.right - pbRect.left;
    const sy = sRect.top + sRect.height / 2 - pbRect.top;

    const c = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const dx = (mx - sx) * 0.5;
    c.setAttribute('d', `M ${sx} ${sy} C ${sx + dx} ${sy}, ${mx - dx} ${my}, ${mx} ${my}`);
    c.classList.baseVal.add(s.peak > 0.01 ? 'active' : '');
    svg.appendChild(c);
  }
}

window.addEventListener('resize', drawCables);
document.getElementById('sources').addEventListener('scroll', drawCables, { passive: true });
document.getElementById('outputs').addEventListener('scroll', drawCables, { passive: true });

document.getElementById('master-volume').addEventListener('change', async (e) => {
  try { await api('/api/master', { method: 'POST', body: JSON.stringify({ volume: parseFloat(e.target.value) }) }); }
  catch (err) { setStatus(err.message, 'error'); }
});

document.getElementById('btn-add').addEventListener('click', () => { refreshEndpoints(); document.getElementById('add-modal').classList.add('open'); });
document.getElementById('add-cancel').addEventListener('click', () => document.getElementById('add-modal').classList.remove('open'));
document.getElementById('add-ok').addEventListener('click', addStrip);

document.getElementById('btn-save').addEventListener('click', () => document.getElementById('save-modal').classList.add('open'));
document.getElementById('save-cancel').addEventListener('click', () => document.getElementById('save-modal').classList.remove('open'));
document.getElementById('save-ok').addEventListener('click', async () => {
  const path = document.getElementById('save-path').value.trim();
  if (!path) return;
  try {
    await api('/api/presets/save', { method: 'POST', body: JSON.stringify({ path }) });
    document.getElementById('save-modal').classList.remove('open');
    setStatus('Preset saved', 'connected');
  } catch (e) { alert('Failed to save: ' + e.message); }
});

connect();
</script>
</body>
</html>
