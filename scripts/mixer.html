<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnniAudio Mixer</title>
<style>
  :root {
    --bg: #0b0c10;
    --panel: #14161d;
    --surface: #1a1d26;
    --text: #e5e7eb;
    --muted: #6b7280;
    --accent: #3b82f6;
    --accent2: #22c55e;
    --danger: #ef4444;
    --border: #2a2e3a;
    --cable: #6366f1;
    --cable-active: #22d3ee;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    overflow: hidden;
  }
  header {
    height: 48px;
    padding: 0 12px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    gap: 12px;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.25px; }
  .toolbar { display: flex; align-items: center; gap: 8px; }
  .status { font-size: 12px; color: var(--muted); }
  .status.connected { color: var(--accent2); }
  .status.error { color: var(--danger); }
  input, select, button {
    background: #0f1118;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 8px;
    font-size: 12px;
    outline: none;
  }
  button { background: var(--surface); cursor: pointer; line-height: 1; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.1); }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  button.danger:hover { filter: brightness(1.1); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  main {
    flex: 1;
    display: flex;
    flex-direction: row;
    position: relative;
    overflow: hidden;
  }
  #cables {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  #cables path {
    fill: none;
    stroke: var(--cable);
    stroke-width: 2;
    stroke-linecap: round;
    opacity: .75;
    transition: stroke .15s, opacity .15s, stroke-width .15s;
  }
  #cables path.active {
    stroke: var(--cable-active);
    opacity: 1;
    stroke-width: 3;
    filter: drop-shadow(0 0 4px rgba(34,211,238,.6));
  }

  .rail {
    width: 260px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: none;
    border-bottom: none;
    display: flex;
    flex-direction: column;
    z-index: 2;
    overflow: hidden;
  }
  #inputs { border-left: none; }
  #outputs { border-right: none; }
  .rail-title {
    padding: 10px 12px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: .4px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .rail-title .count { font-weight: 500; color: var(--text); }
  .node-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .node {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: relative;
  }
  .node.output { border-left: 3px solid var(--accent); }
  .node.route { border-left: 3px solid var(--cable); }
  .node-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .node-title {
    font-weight: 600;
    font-size: 12px;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 0;
    flex: 1;
    min-width: 0;
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
  }
  .node-title:focus { background: #0f1118; outline: 1px solid var(--accent); border-radius: 2px; padding: 1px 3px; }
  .node-meta {
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .node-body {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 48px;
  }
  .meter {
    width: 8px;
    height: 56px;
    background: #0f1118;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  .meter-fill {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background: linear-gradient(to top, #22c55e 0%, #eab308 65%, #ef4444 100%);
    border-radius: 0 0 4px 4px;
    transition: height .05s linear;
  }
  .meter-peak {
    position: absolute;
    left: 0;
    width: 100%;
    height: 2px;
    background: #fff;
    border-radius: 1px;
    transition: bottom .05s linear;
  }
  .controls {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .fader-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .fader-row input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: #2f333f;
    border-radius: 2px;
    outline: none;
  }
  .fader-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  .fader-val {
    width: 2.2rem;
    text-align: right;
    font-size: 10px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .btn-row { display: flex; gap: 4px; }
  .btn-mute { font-size: 10px; padding: 3px 6px; }
  .btn-mute.muted { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn-icon { font-size: 11px; padding: 2px 5px; }

  .empty {
    color: var(--muted);
    font-size: 11px;
    text-align: center;
    padding: 16px 8px;
    font-style: italic;
  }
  .add-btn {
    margin: 8px;
    padding: 8px;
    text-align: center;
    border: 1.5px dashed var(--border);
    border-radius: 5px;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    transition: border-color .15s, color .15s;
  }
  .add-btn:hover { border-color: var(--accent); color: var(--text); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    width: 90%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .modal h2 { margin: 0 0 4px 0; font-size: 14px; }
  .modal-row { display: flex; flex-direction: column; gap: 3px; }
  .modal-row label { font-size: 11px; color: var(--muted); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>AnniAudio Mixer</h1>
  <div class="toolbar">
    <span class="status" id="status">Disconnected</span>
    <input id="port" type="number" value="8850" min="0" max="65535" style="width:70px" title="Control API port">
    <button id="btn-add-output">+ Output</button>
    <button id="btn-add-route">+ Route</button>
    <button id="btn-save">Save</button>
  </div>
</header>

<main>
  <svg id="cables"><g id="cable-layer"></g></svg>

  <aside class="rail" id="inputs">
    <div class="rail-title">Routes <span class="count" id="route-count">0</span></div>
    <div class="node-list" id="route-list"></div>
    <div class="add-btn" id="rail-add-route">+ Add route</div>
  </aside>

  <section id="canvas" style="flex:1; position:relative; z-index:0;"></section>

  <aside class="rail" id="outputs">
    <div class="rail-title">Outputs <span class="count" id="output-count">0</span></div>
    <div class="node-list" id="output-list"></div>
    <div class="add-btn" id="rail-add-output">+ Add output</div>
  </aside>
</main>

<div class="modal-overlay" id="route-modal">
  <div class="modal">
    <h2>Add route</h2>
    <div class="modal-row"><label>Source</label><select id="route-source"></select></div>
    <div class="modal-row"><label>Output</label><select id="route-output"></select></div>
    <div class="modal-row"><label>Name (optional)</label><input id="route-name" type="text" placeholder="source name"></div>
    <div class="modal-row"><label>Volume (%)</label><input id="route-volume" type="number" value="100" min="0" max="200"></div>
    <div class="modal-actions">
      <button id="route-cancel">Cancel</button>
      <button id="route-ok" class="primary">Add</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="output-modal">
  <div class="modal">
    <h2>Add output</h2>
    <div class="modal-row"><label>Render endpoint</label><select id="output-source"></select></div>
    <div class="modal-actions">
      <button id="output-cancel">Cancel</button>
      <button id="output-ok" class="primary">Add</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="save-modal">
  <div class="modal">
    <h2>Save preset</h2>
    <div class="modal-row"><label>Path</label><input id="save-path" type="text" value="config/mixers/"></div>
    <div class="modal-actions">
      <button id="save-cancel">Cancel</button>
      <button id="save-ok" class="primary">Save</button>
    </div>
  </div>
</div>

<script>
const qs = new URLSearchParams(location.search);
let port = parseInt(qs.get('port'), 10) || 8850;
const portInput = document.getElementById('port');
portInput.value = port;
let base = `http://127.0.0.1:${port}`;

let state = null;
let endpoints = [];
let es = null;
const outputNodes = new Map();
const routeNodes = new Map();

const statusEl = document.getElementById('status');
function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = 'status' + (cls ? ' ' + cls : '');
}

function rebuildBase() {
  port = parseInt(portInput.value, 10) || 8850;
  base = `http://127.0.0.1:${port}`;
  connect();
}
portInput.addEventListener('change', rebuildBase);

async function api(path, opts = {}) {
  const res = await fetch(base + path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (!res.ok) {
    let msg = res.statusText;
    try { const j = await res.json(); if (j.error) msg = j.error; } catch {}
    throw new Error(msg);
  }
  return res.status === 204 ? null : res.json();
}

function connect() {
  if (es) { es.close(); es = null; }
  setStatus('Connecting...');
  es = new EventSource(base + '/api/events');
  es.onopen = () => { setStatus('Connected', 'connected'); refreshEndpoints(); };
  es.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data.replace(/^data: /, ''));
      if (msg && typeof msg === 'object') updateState(msg);
    } catch (err) { console.error('SSE parse error', err); }
  };
  es.onerror = () => setStatus('Disconnected', 'error');
}

function updateState(newState) {
  state = newState;
  render();
}

function meterPct(v) {
  if (v <= 0.00001) return 0;
  const db = 20 * Math.log10(Math.min(v, 1));
  return Math.max(0, Math.min(100, (db + 60) / 60 * 100));
}

function setMeter(meter, peak, rms) {
  if (!meter) return;
  meter.querySelector('.meter-fill').style.height = meterPct(rms) + '%';
  meter.querySelector('.meter-peak').style.bottom = meterPct(peak) + '%';
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function outputKey(name) { return 'out-' + name; }
function sanitizeId(s) { return String(s).replace(/[^a-zA-Z0-9_-]/g, '_'); }

function createOutputNode(out) {
  const el = document.createElement('div');
  el.className = 'node output';
  el.dataset.name = out.name;
  el.innerHTML = `
    <div class="node-header">
      <input class="node-title output-name" value="${escapeHtml(out.name)}" readonly>
      <button class="danger btn-icon output-remove" title="Remove output">×</button>
    </div>
    <div class="node-body">
      <div class="meter" id="meter-out-${sanitizeId(out.name)}"><div class="meter-fill"></div><div class="meter-peak"></div></div>
      <div class="controls">
        <div class="fader-row">
          <input type="range" min="0" max="200" class="output-fader" value="100">
          <span class="fader-val">100%</span>
        </div>
      </div>
    </div>
  `;

  const fader = el.querySelector('.output-fader');
  const val = el.querySelector('.fader-val');
  fader.addEventListener('input', () => { val.textContent = Math.round(fader.value) + '%'; });
  fader.addEventListener('change', async () => {
    try { await api('/api/outputs/master', { method: 'POST', body: JSON.stringify({ name: out.name, volume: parseFloat(fader.value) }) }); }
    catch (e) { setStatus(e.message, 'error'); }
  });

  el.querySelector('.output-remove').addEventListener('click', async () => {
    try { await api('/api/outputs', { method: 'DELETE', body: JSON.stringify({ name: out.name }) }); }
    catch (e) { setStatus(e.message, 'error'); }
  });

  return el;
}

function createRouteNode(s) {
  const el = document.createElement('div');
  el.className = 'node route';
  el.dataset.id = s.id;
  el.dataset.output = s.output;
  el.innerHTML = `
    <div class="node-header">
      <input class="node-title route-name" value="${escapeHtml(s.name)}" title="Rename">
      <button class="danger btn-icon route-remove" title="Remove route">×</button>
    </div>
    <div class="node-meta">${escapeHtml(s.source)} → ${escapeHtml(s.output)}</div>
    <div class="node-body">
      <div class="meter" id="meter-route-${s.id}"><div class="meter-fill"></div><div class="meter-peak"></div></div>
      <div class="controls">
        <div class="fader-row">
          <input type="range" min="0" max="200" class="route-fader" value="100">
          <span class="fader-val">100%</span>
        </div>
        <button class="btn-mute">Mute</button>
      </div>
    </div>
  `;

  const nameInput = el.querySelector('.route-name');
  nameInput.addEventListener('change', async () => {
    try { await api(`/api/strips/${s.id}`, { method: 'PATCH', body: JSON.stringify({ name: nameInput.value }) }); }
    catch (e) { setStatus(e.message, 'error'); }
  });

  const fader = el.querySelector('.route-fader');
  const val = el.querySelector('.fader-val');
  fader.addEventListener('input', () => { val.textContent = Math.round(fader.value) + '%'; });
  fader.addEventListener('change', async () => {
    try { await api(`/api/strips/${s.id}`, { method: 'PATCH', body: JSON.stringify({ volume: parseFloat(fader.value) }) }); }
    catch (e) { setStatus(e.message, 'error'); }
  });

  const muteBtn = el.querySelector('.btn-mute');
  muteBtn.addEventListener('click', async () => {
    const muted = !muteBtn.classList.contains('muted');
    try { await api(`/api/strips/${s.id}`, { method: 'PATCH', body: JSON.stringify({ muted }) }); }
    catch (e) { setStatus(e.message, 'error'); }
  });

  el.querySelector('.route-remove').addEventListener('click', async () => {
    try { await api(`/api/strips/${s.id}`, { method: 'DELETE' }); }
    catch (e) { setStatus(e.message, 'error'); }
  });

  return el;
}

function updateOutputNode(el, out) {
  const fader = el.querySelector('.output-fader');
  const val = el.querySelector('.fader-val');
  if (document.activeElement !== fader) {
    fader.value = Math.round(out.master);
    val.textContent = Math.round(out.master) + '%';
  }
  setMeter(el.querySelector('.meter'), out.masterPeak || 0, out.masterRms || 0);
}

function updateRouteNode(el, s) {
  const nameInput = el.querySelector('.route-name');
  if (document.activeElement !== nameInput) nameInput.value = s.name;

  const meta = el.querySelector('.node-meta');
  meta.textContent = `${s.source} → ${s.output}`;
  meta.title = `${s.source} → ${s.output}`;

  const fader = el.querySelector('.route-fader');
  const val = el.querySelector('.fader-val');
  if (document.activeElement !== fader) {
    fader.value = Math.round(s.volume);
    val.textContent = Math.round(s.volume) + '%';
  }

  const muteBtn = el.querySelector('.btn-mute');
  if (s.muted) {
    muteBtn.classList.add('muted');
    muteBtn.textContent = 'Unmute';
  } else {
    muteBtn.classList.remove('muted');
    muteBtn.textContent = 'Mute';
  }

  setMeter(el.querySelector('.meter'), s.peak || 0, s.rms || 0);
}

function render() {
  if (!state) return;
  const outputs = state.outputs || [];
  const routes = outputs.reduce((acc, o) => acc.concat(o.strips || []), []);

  document.getElementById('output-count').textContent = outputs.length;
  document.getElementById('route-count').textContent = routes.length;

  const outList = document.getElementById('output-list');
  const routeList = document.getElementById('route-list');

  const activeOutKeys = new Set();
  for (const out of outputs) {
    const key = outputKey(out.name);
    activeOutKeys.add(key);
    let el = outputNodes.get(key);
    if (!el) {
      el = createOutputNode(out);
      outList.appendChild(el);
      outputNodes.set(key, el);
    }
    updateOutputNode(el, out);
  }

  const activeRouteIds = new Set();
  for (const s of routes) {
    activeRouteIds.add(String(s.id));
    let el = routeNodes.get(String(s.id));
    if (!el) {
      el = createRouteNode(s);
      routeList.appendChild(el);
      routeNodes.set(String(s.id), el);
    }
    updateRouteNode(el, s);
  }

  for (const [key, el] of outputNodes) {
    if (!activeOutKeys.has(key)) { el.remove(); outputNodes.delete(key); }
  }
  for (const [id, el] of routeNodes) {
    if (!activeRouteIds.has(id)) { el.remove(); routeNodes.delete(id); }
  }

  if (outputs.length === 0) outList.innerHTML = '<div class="empty">No outputs yet.</div>';
  else if (outList.querySelector('.empty')) outList.querySelector('.empty').remove();

  if (routes.length === 0) routeList.innerHTML = '<div class="empty">No routes. Add a route to connect a source to an output.</div>';
  else if (routeList.querySelector('.empty')) routeList.querySelector('.empty').remove();

  requestAnimationFrame(drawCables);
  populateOutputSelect();
}

function outputNodeByName(name) {
  return outputNodes.get(outputKey(name));
}

function drawCables() {
  const svg = document.getElementById('cable-layer');
  svg.innerHTML = '';
  if (!state || !state.outputs) return;

  const main = document.querySelector('main').getBoundingClientRect();
  const routes = state.outputs.reduce((acc, o) => acc.concat(o.strips || []), []);

  for (const s of routes) {
    const src = routeNodes.get(String(s.id));
    const dst = outputNodeByName(s.output);
    if (!src || !dst) continue;

    const sRect = src.getBoundingClientRect();
    const dRect = dst.getBoundingClientRect();
    const sx = sRect.right - main.left;
    const sy = sRect.top + sRect.height / 2 - main.top;
    const dx = dRect.left - main.left;
    const dy = dRect.top + dRect.height / 2 - main.top;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const cx = (dx - sx) * 0.55;
    path.setAttribute('d', `M ${sx} ${sy} C ${sx + cx} ${sy}, ${dx - cx} ${dy}, ${dx} ${dy}`);
    if (s.peak > 0.01) path.setAttribute('class', 'active');
    svg.appendChild(path);
  }
}

async function refreshEndpoints() {
  try {
    const data = await api('/api/endpoints');
    endpoints = data.endpoints || [];
    populateSourceSelect();
    populateOutputSourceSelect();
  } catch (e) { console.error('Endpoints load failed', e); }
}

function populateSourceSelect() {
  const sel = document.getElementById('route-source');
  const cur = sel.value;
  sel.innerHTML = '';
  for (const ep of endpoints) {
    const opt = document.createElement('option');
    opt.value = ep.name;
    opt.textContent = `${ep.isRender ? '[R]' : '[C]'} ${ep.name}`;
    sel.appendChild(opt);
  }
  if (cur) sel.value = cur;
}

function populateOutputSourceSelect() {
  const sel = document.getElementById('output-source');
  const cur = sel.value;
  sel.innerHTML = '';
  for (const ep of endpoints) {
    if (!ep.isRender) continue;
    const opt = document.createElement('option');
    opt.value = ep.name;
    opt.textContent = ep.name;
    sel.appendChild(opt);
  }
  if (cur) sel.value = cur;
}

function populateOutputSelect() {
  const sel = document.getElementById('route-output');
  const cur = sel.value;
  sel.innerHTML = '';
  if (state && state.outputs) {
    for (const out of state.outputs) {
      const opt = document.createElement('option');
      opt.value = out.name;
      opt.textContent = out.name;
      sel.appendChild(opt);
    }
  }
  if (cur && Array.from(sel.options).some(o => o.value === cur)) sel.value = cur;
}

function openRouteModal() { refreshEndpoints(); document.getElementById('route-modal').classList.add('open'); }
function openOutputModal() { refreshEndpoints(); document.getElementById('output-modal').classList.add('open'); }

document.getElementById('btn-add-route').addEventListener('click', openRouteModal);
document.getElementById('rail-add-route').addEventListener('click', openRouteModal);
document.getElementById('route-cancel').addEventListener('click', () => document.getElementById('route-modal').classList.remove('open'));
document.getElementById('route-ok').addEventListener('click', async () => {
  const source = document.getElementById('route-source').value;
  const output = document.getElementById('route-output').value;
  const name = document.getElementById('route-name').value;
  const volume = parseFloat(document.getElementById('route-volume').value) || 100;
  if (!source || !output) { alert('Select a source and output'); return; }
  try {
    await api('/api/strips', { method: 'POST', body: JSON.stringify({ source, output, name, volume }) });
    document.getElementById('route-modal').classList.remove('open');
    document.getElementById('route-name').value = '';
  } catch (e) { alert('Failed to add route: ' + e.message); }
});

document.getElementById('btn-add-output').addEventListener('click', openOutputModal);
document.getElementById('rail-add-output').addEventListener('click', openOutputModal);
document.getElementById('output-cancel').addEventListener('click', () => document.getElementById('output-modal').classList.remove('open'));
document.getElementById('output-ok').addEventListener('click', async () => {
  const name = document.getElementById('output-source').value;
  if (!name) { alert('Select a render endpoint'); return; }
  try {
    await api('/api/outputs', { method: 'POST', body: JSON.stringify({ name }) });
    document.getElementById('output-modal').classList.remove('open');
  } catch (e) { alert('Failed to add output: ' + e.message); }
});

document.getElementById('btn-save').addEventListener('click', () => document.getElementById('save-modal').classList.add('open'));
document.getElementById('save-cancel').addEventListener('click', () => document.getElementById('save-modal').classList.remove('open'));
document.getElementById('save-ok').addEventListener('click', async () => {
  const path = document.getElementById('save-path').value.trim();
  if (!path) return;
  try {
    await api('/api/presets/save', { method: 'POST', body: JSON.stringify({ path }) });
    document.getElementById('save-modal').classList.remove('open');
    setStatus('Preset saved', 'connected');
  } catch (e) { alert('Failed to save: ' + e.message); }
});

window.addEventListener('resize', () => requestAnimationFrame(drawCables));
document.getElementById('inputs').addEventListener('scroll', () => requestAnimationFrame(drawCables), { passive: true });
document.getElementById('outputs').addEventListener('scroll', () => requestAnimationFrame(drawCables), { passive: true });

connect();
</script>
</body>
</html>
