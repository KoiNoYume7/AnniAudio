<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnniAudio Mixer</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #14161d;
    --surface: #1c1f29;
    --text: #e4e6eb;
    --muted: #8b92a8;
    --accent: #3b82f6;
    --accent2: #10b981;
    --danger: #ef4444;
    --border: #2a2e3a;
    --input-bg: #0f1118;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    height: 56px;
    padding: 0 1rem;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  header h1 { margin: 0; font-size: 1.25rem; }
  .toolbar { display: flex; align-items: center; gap: 0.75rem; }
  .status { font-size: 0.85rem; color: var(--muted); }
  .status.connected { color: var(--accent2); }
  .status.error { color: var(--danger); }
  input, select, button {
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 0.375rem;
    padding: 0.4rem 0.6rem;
    font-size: 0.85rem;
  }
  button { background: var(--surface); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button.primary:hover { filter: brightness(1.1); }
  button.danger { background: var(--danger); border-color: var(--danger); color: white; }
  button.danger:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  #mixer {
    flex: 1;
    display: flex;
    gap: 1rem;
    padding: 1rem;
    overflow-x: auto;
    align-items: stretch;
  }
  .strip, .master-strip {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    width: 120px;
    min-width: 120px;
    display: flex;
    flex-direction: column;
    padding: 0.75rem 0.5rem;
    gap: 0.6rem;
    position: relative;
  }
  .strip.muted { opacity: 0.65; }
  .strip-header { text-align: center; min-height: 3.5rem; }
  .strip-name {
    width: 100%;
    text-align: center;
    background: transparent;
    border: none;
    border-bottom: 1px solid transparent;
    color: var(--text);
    font-weight: 600;
    font-size: 0.9rem;
    padding: 0.2rem;
  }
  .strip-name:hover, .strip-name:focus {
    border-bottom-color: var(--border);
    outline: none;
  }
  .strip-source {
    font-size: 0.7rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 0.2rem;
  }
  .fader-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 120px;
  }
  .fader-wrap input[type=range] {
    transform: rotate(-90deg);
    width: 180px;
    height: 6px;
    -webkit-appearance: none;
    appearance: none;
    background: var(--border);
    border-radius: 3px;
    outline: none;
  }
  .fader-wrap input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  .fader-wrap input[type=range]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
  }
  .value-label {
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .strip-controls { display: flex; gap: 0.4rem; justify-content: center; }
  .btn-mute {
    flex: 1;
    font-size: 0.75rem;
    padding: 0.35rem 0.3rem;
  }
  .btn-mute.muted { background: var(--danger); border-color: var(--danger); color: white; }
  .knob-select {
    width: 100%;
    font-size: 0.75rem;
    padding: 0.25rem;
  }
  #master-section {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    padding: 1rem;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  #master-section label { font-size: 0.85rem; color: var(--muted); }
  #master-fader { display: flex; align-items: center; gap: 1rem; }
  #master-fader input[type=range] {
    flex: 1;
    max-width: 300px;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    outline: none;
  }
  #master-fader input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent2);
    cursor: pointer;
  }
  #master-fader input[type=range]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent2);
    cursor: pointer;
    border: none;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    padding: 1.25rem;
    width: 90%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .modal h2 { margin: 0 0 0.25rem 0; font-size: 1.1rem; }
  .modal-row { display: flex; flex-direction: column; gap: 0.35rem; }
  .modal-row label { font-size: 0.8rem; color: var(--muted); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.5rem; }

  .empty {
    color: var(--muted);
    font-style: italic;
    padding: 2rem;
    text-align: center;
    width: 100%;
  }
</style>
</head>
<body>
<header>
  <h1>AnniAudio Mixer</h1>
  <div class="toolbar">
    <span class="status" id="status">Disconnected</span>
    <input id="port" type="number" value="8850" min="0" max="65535" style="width:80px" title="Control API port">
    <button id="btn-save" title="Save current state as a mixer preset">Save preset</button>
    <button id="btn-add" class="primary">+ Add strip</button>
  </div>
</header>

<div id="master-section">
  <label>Master output: <strong id="master-output">—</strong></label>
  <div id="master-fader">
    <span>Master</span>
    <input id="master-volume" type="range" min="0" max="200" value="100">
    <span id="master-value" class="value-label">100%</span>
  </div>
</div>

<div id="mixer"><div class="empty">Loading mixer state...</div></div>

<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <h2>Add strip</h2>
    <div class="modal-row">
      <label>Source endpoint</label>
      <select id="add-source"></select>
    </div>
    <div class="modal-row">
      <label>Name (optional)</label>
      <input id="add-name" type="text" placeholder="defaults to source name">
    </div>
    <div class="modal-row">
      <label>Initial volume (%)</label>
      <input id="add-volume" type="number" value="100" min="0" max="200">
    </div>
    <div class="modal-actions">
      <button id="add-cancel">Cancel</button>
      <button id="add-ok" class="primary">Add</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="save-modal">
  <div class="modal">
    <h2>Save preset</h2>
    <div class="modal-row">
      <label>Filename (relative to project root, e.g. config/mixers/my_mix.json)</label>
      <input id="save-path" type="text" value="config/mixers/">
    </div>
    <div class="modal-actions">
      <button id="save-cancel">Cancel</button>
      <button id="save-ok" class="primary">Save</button>
    </div>
  </div>
</div>

<script>
const qs = new URLSearchParams(location.search);
let port = parseInt(qs.get('port'), 10) || 8850;
const portInput = document.getElementById('port');
portInput.value = port;

let base = `http://127.0.0.1:${port}`;
let state = null;
let es = null;
let ignoreNextEdit = null; // strip id that is mid-drag and should not re-render from SSE

function setStatus(text, cls) {
  const s = document.getElementById('status');
  s.textContent = text;
  s.className = 'status' + (cls ? ' ' + cls : '');
}

function rebuildBase() {
  port = parseInt(portInput.value, 10) || 8850;
  base = `http://127.0.0.1:${port}`;
  connect();
}
portInput.addEventListener('change', rebuildBase);

async function api(path, opts = {}) {
  const res = await fetch(base + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  if (!res.ok) {
    let msg = res.statusText;
    try { const j = await res.json(); if (j.error) msg = j.error; } catch {}
    throw new Error(msg);
  }
  if (res.status === 204) return null;
  return res.json();
}

function connect() {
  if (es) { es.close(); es = null; }
  setStatus('Connecting...');
  es = new EventSource(base + '/api/events');
  es.onopen = () => setStatus('Connected', 'connected');
  es.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data.replace(/^data: /, ''));
      if (msg && typeof msg === 'object') updateState(msg);
    } catch (err) { console.error('SSE parse error', err); }
  };
  es.onerror = () => setStatus('Disconnected', 'error');
}

function updateState(newState) {
  state = newState;
  render();
}

function render() {
  if (!state) return;
  document.getElementById('master-output').textContent = state.output || '—';
  const mv = document.getElementById('master-volume');
  if (document.activeElement !== mv) mv.value = Math.round(state.master);
  document.getElementById('master-value').textContent = Math.round(state.master) + '%';

  const mixer = document.getElementById('mixer');
  mixer.innerHTML = '';
  if (!state.strips || state.strips.length === 0) {
    mixer.innerHTML = '<div class="empty">No strips. Click + Add strip to get started.</div>';
    return;
  }
  for (const s of state.strips) {
    if (ignoreNextEdit === s.id) continue; // being edited; keep existing DOM
    const el = document.createElement('div');
    el.className = 'strip' + (s.muted ? ' muted' : '');
    el.dataset.id = s.id;
    el.innerHTML = `
      <div class="strip-header">
        <input class="strip-name" value="${escapeHtml(s.name)}" title="${escapeHtml(s.name)}">
        <div class="strip-source" title="${escapeHtml(s.source)}">${escapeHtml(s.source)}</div>
      </div>
      <div class="fader-wrap">
        <input type="range" min="0" max="200" value="${Math.round(s.volume)}" class="strip-fader">
      </div>
      <div class="value-label">${Math.round(s.volume)}%</div>
      <div class="strip-controls">
        <button class="btn-mute ${s.muted ? 'muted' : ''}">${s.muted ? 'Unmute' : 'Mute'}</button>
        <button class="danger strip-remove" title="Remove">×</button>
      </div>
      <select class="knob-select" title="Assign to controller knob">
        <option value="">No knob</option>
        ${[0,1,2,3,4,5].map(k => `<option value="${k}" ${s.knobIndex === k ? 'selected' : ''}>Knob ${k}</option>`).join('')}
      </select>
    `;
    const nameInput = el.querySelector('.strip-name');
    nameInput.addEventListener('change', () => patchStrip(s.id, { name: nameInput.value }));

    const fader = el.querySelector('.strip-fader');
    fader.addEventListener('mousedown', () => { ignoreNextEdit = s.id; });
    fader.addEventListener('touchstart', () => { ignoreNextEdit = s.id; }, { passive: true });
    fader.addEventListener('input', () => {
      el.querySelector('.value-label').textContent = fader.value + '%';
    });
    fader.addEventListener('change', () => {
      ignoreNextEdit = null;
      patchStrip(s.id, { volume: parseFloat(fader.value) });
    });

    const muteBtn = el.querySelector('.btn-mute');
    muteBtn.addEventListener('click', () => patchStrip(s.id, { muted: !s.muted }));

    const removeBtn = el.querySelector('.strip-remove');
    removeBtn.addEventListener('click', () => removeStrip(s.id));

    const knobSelect = el.querySelector('.knob-select');
    knobSelect.addEventListener('change', () => {
      const val = knobSelect.value;
      patchStrip(s.id, { knobIndex: val === '' ? null : parseInt(val, 10) });
    });

    mixer.appendChild(el);
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function patchStrip(id, changes) {
  try {
    await api(`/api/strips/${id}`, {
      method: 'PATCH',
      body: JSON.stringify(changes),
    });
  } catch (e) {
    setStatus(e.message, 'error');
    setTimeout(() => setStatus('Connected', 'connected'), 2000);
  }
}

async function removeStrip(id) {
  try {
    await api(`/api/strips/${id}`, { method: 'DELETE' });
  } catch (e) {
    setStatus(e.message, 'error');
  }
}

async function addStrip() {
  const source = document.getElementById('add-source').value;
  if (!source) return;
  const name = document.getElementById('add-name').value;
  const volume = parseFloat(document.getElementById('add-volume').value) || 100;
  try {
    await api('/api/strips', {
      method: 'POST',
      body: JSON.stringify({ source, name, volume }),
    });
    document.getElementById('add-modal').classList.remove('open');
    document.getElementById('add-name').value = '';
    document.getElementById('add-volume').value = '100';
  } catch (e) {
    alert('Failed to add strip: ' + e.message);
  }
}

async function refreshEndpoints() {
  try {
    const { endpoints } = await api('/api/endpoints');
    const sel = document.getElementById('add-source');
    sel.innerHTML = '';
    for (const ep of endpoints) {
      const opt = document.createElement('option');
      opt.value = ep.name;
      opt.textContent = `${ep.isRender ? '[Render]' : '[Capture]'} ${ep.name}${ep.isDefault ? ' (default)' : ''}`;
      sel.appendChild(opt);
    }
  } catch (e) {
    console.error('Endpoints load failed', e);
  }
}

document.getElementById('master-volume').addEventListener('change', async (e) => {
  try {
    await api('/api/master', { method: 'POST', body: JSON.stringify({ volume: parseFloat(e.target.value) }) });
  } catch (err) {
    setStatus(err.message, 'error');
  }
});

document.getElementById('btn-add').addEventListener('click', () => {
  refreshEndpoints();
  document.getElementById('add-modal').classList.add('open');
});
document.getElementById('add-cancel').addEventListener('click', () => document.getElementById('add-modal').classList.remove('open'));
document.getElementById('add-ok').addEventListener('click', addStrip);

document.getElementById('btn-save').addEventListener('click', () => {
  document.getElementById('save-modal').classList.add('open');
});
document.getElementById('save-cancel').addEventListener('click', () => document.getElementById('save-modal').classList.remove('open'));
document.getElementById('save-ok').addEventListener('click', async () => {
  const path = document.getElementById('save-path').value.trim();
  if (!path) return;
  try {
    await api('/api/presets/save', { method: 'POST', body: JSON.stringify({ path }) });
    document.getElementById('save-modal').classList.remove('open');
    setStatus('Preset saved', 'connected');
  } catch (e) {
    alert('Failed to save: ' + e.message);
  }
});

connect();
</script>
</body>
</html>
